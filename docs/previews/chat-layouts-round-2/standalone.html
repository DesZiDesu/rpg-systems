/* 01 — A system dossier with a spine, numbered chronicle and folded voice leaf. */
.relic-file{display:grid;grid-template-columns:30px minmax(0,1fr);position:relative;color:#d7c896;padding:16px 16px 22px 0;border:1px solid #746033;background:linear-gradient(145deg,#15160f,#0a0d0a);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,14px 100%,0 calc(100% - 14px));box-shadow:inset 0 0 0 5px #d4b14f08}.relic-spine{display:flex;flex-direction:column;align-items:center;font:9px/1 monospace;color:#b49951;gap:16px;padding-block:6px;letter-spacing:1px;border-right:1px solid #544722}.relic-spine i{width:1px;flex:1;background:linear-gradient(#c1a24e22,#c1a24e99,#c1a24e22)}.relic-content{min-width:0;padding-left:19px}.rf2 .relic-header{display:grid;grid-template-columns:62px minmax(0,1fr) 18px;align-items:center;gap:14px;width:100%;text-align:left;border-bottom:1px solid #554821;padding-bottom:18px}.relic-crest{width:62px;color:#e2c366}.relic-identity{display:flex;flex-direction:column;gap:3px}.relic-identity small{font:9px/1.8 monospace;letter-spacing:1.4px;color:#9a884f}.relic-identity strong{font:650 26px/1.35 'Trebuchet MS',system-ui,sans-serif;color:#ebdfb0;letter-spacing:.5px}.relic-identity>span{font-size:11px;color:#a99c77}.relic-identity b{font-weight:400;padding-inline:5px;color:#d3b959}.record-arrow{align-self:start;color:#d9c16c}.relic-entry{display:grid;grid-template-columns:29px minmax(0,1fr);gap:12px;padding-top:22px;color:#d8d5c7}.entry-index{display:flex;align-items:center;flex-direction:column;gap:12px;color:#aa914d;font:9px/1 monospace;border-right:1px solid #69542e}.entry-index .pen{width:15px}.entry-kicker{display:flex;justify-content:space-between;gap:10px;font:9px/1.7 monospace;letter-spacing:1.4px;color:#b49754;margin-bottom:8px}.entry-kicker span{font:10px/1.7 system-ui;letter-spacing:0;color:#817b66}.entry-end{display:block;margin-top:12px;font-size:9px;color:#9a814a}.relic-fold{position:relative;margin:21px 0 0 38px;padding:33px 22px 12px;border-left:3px solid #c9ab57;background:#d9ca9e;color:#292820;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%);box-shadow:inset 0 -5px #7f68291a}.fold-tab{position:absolute;top:0;left:0;padding:4px 9px;background:#67572e;color:#f0ddb1;font:9px/1.8 monospace;letter-spacing:1px}.fold-quote{position:absolute;right:15px;top:14px;font:48px/1 Georgia;color:#8f7438;opacity:.5}.fold-end{display:flex;justify-content:space-between;border-top:1px solid #96804455;padding-top:8px;margin-top:13px;font-size:9px;color:#807044}.fold-end i{font-style:normal;letter-spacing:3px}.file-corner{position:absolute;right:7px;bottom:7px;width:20px;height:8px;border-bottom:1px solid #967d40;border-right:1px solid #967d40}

/* 02 — A visual novel stage with a floating character and a shaped speech bubble. */
.starfall-stage{position:relative;padding:5px 0 6px;color:#e8e0f0}.rf2 .starfall-header{display:flex;align-items:center;justify-content:flex-end;gap:21px;min-height:123px;width:100%;padding:0 17px 5px 0;text-align:right}.starfall-name{display:flex;flex-direction:column;align-items:flex-end;gap:3px}.starfall-name small{font:9px/1.8 system-ui;letter-spacing:2px;color:#b7a9cd}.starfall-name strong{font:italic 34px/1.3 Georgia,serif;color:#eadbff;text-shadow:0 0 25px #ac8bca24}.starfall-name>span{font-size:12px;color:#b6a5c9}.starfall-name i{font-style:normal;color:#eac0d3;margin:0 5px}.starfall-portrait{display:grid;place-items:center;position:relative;width:106px;height:106px;flex-shrink:0;border-radius:50%;background:linear-gradient(150deg,#e5d4ef,#b2a1cd);border:5px solid #e9e3fa;box-shadow:0 0 0 1px #a88cc477,0 12px 28px #141225;isolation:isolate}.starfall-portrait>svg{width:90px;height:90px;border-radius:50%;margin-top:7px;overflow:hidden}.portrait-orbit{position:absolute;inset:-12px;border:1px dashed #b79fca88;border-radius:50%}.star-a,.star-b{position:absolute;color:#eabfda;text-shadow:0 0 12px #eabfda77}.star-a{font-size:25px;right:-10px;top:-9px}.star-b{font-size:18px;left:-14px;bottom:5px}.starfall-caption{position:relative;text-align:center;width:90%;margin:16px auto 26px;color:#c7bfd6;padding:4px 12px}.caption-stars{display:flex;justify-content:center;gap:13px;align-items:center;font-size:14px;color:#cdb4e9;margin-bottom:9px}.caption-stars span{font-size:10px;letter-spacing:1.1px;color:#a192bb}.starfall-bubble{position:relative;margin:0 15px 0 0;padding:34px 29px 36px;background:linear-gradient(145deg,#fcf5ff,#eddef2);border:2px solid #eee0fa;color:#52415b;border-radius:38px 8px 38px 38px;box-shadow:7px 8px #9d78bf15}.bubble-name{position:absolute;top:-13px;left:26px;padding:2px 15px;background:#bd9fcd;border-radius:30px;font:italic 15px/1.9 Georgia,serif;color:#fff2ff}.bubble-name i{font-style:normal;font-size:11px;margin-left:8px}.bubble-tail{position:absolute;top:-18px;right:21px;width:23px;height:26px;background:#f9f1fd;clip-path:polygon(0 100%,75% 0,100% 100%)}.bubble-next{position:absolute;right:28px;bottom:8px;font-size:13px;letter-spacing:5px;color:#ac88bd}.stage-spark{position:absolute;width:19px;height:19px;left:0;top:93px;color:#bda1d8;opacity:.5;pointer-events:none}

/* 03 — A gothic portrait monument beside a torn document and a spoken vow. */
.thorn-testament{position:relative;display:grid;grid-template-columns:142px minmax(0,1fr);gap:27px;color:#c8baad;padding-block:7px}.rf2 .thorn-header{width:100%;display:flex;align-items:center;flex-direction:column;gap:14px;align-self:center;text-align:center}.cathedral-window{display:block;position:relative;width:142px;isolation:isolate}.cathedral-window>svg{width:100%;height:auto}.dark-portrait{position:absolute;bottom:14px;left:50%;width:96px;height:128px;transform:translateX(-50%)}.dark-portrait svg{height:100%;width:100%}.thorn-title{display:flex;align-items:center;flex-direction:column;gap:7px}.thorn-title small{font:8px/1.6 Georgia;letter-spacing:2px;color:#9e675c}.thorn-title strong{font:30px/1.15 Georgia,serif;max-width:100%;color:#dac9b6;letter-spacing:1px}.thorn-title>span{font-size:10px;color:#8b7c71;line-height:1.7}.thorn-texts{min-width:0;align-self:center}.torn-manuscript{background:linear-gradient(140deg,#272120,#1a1818);padding:22px 18px 24px;border-top:1px solid #675044;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),96% calc(100% - 1px),89% calc(100% - 8px),80% 100%,72% calc(100% - 10px),64% calc(100% - 2px),52% calc(100% - 6px),43% 100%,30% calc(100% - 7px),24% 100%,13% calc(100% - 11px),0 calc(100% - 3px));font:14px/1.95 Georgia,'Noto Sans Thai',serif;color:#c8b4a2}.manuscript-label{display:flex;gap:8px;align-items:center;margin-bottom:12px;font:9px/1.8 system-ui;color:#98695d}.manuscript-label .pen{width:17px}.manuscript-label i{margin-left:auto;font:12px Georgia;color:#6c5650}.manuscript-rule{display:block;margin-top:17px;width:48px;height:1px;background:#89534b}.thorn-vow{position:relative;margin-top:25px;padding:15px 12px 22px 5px;font:italic 20px/1.85 Georgia,'Noto Sans Thai',serif;color:#d8c3b0;text-align:left}.vow-mark{position:absolute;left:-7px;top:-10px;font:71px/1 Georgia;color:#984b40;z-index:0;opacity:.42}.thorn-vow .story-copy{text-indent:12px}.vow-end{display:block;text-align:right;color:#ae5d4b;font:28px/1 Georgia;margin-top:8px}.ash{width:3px;height:3px;position:absolute;background:#a97755;pointer-events:none;opacity:.6}.ash-one{left:27px;top:23px}.ash-two{left:109px;bottom:48px}

/* 04 — An open book. Prose and dialogue live on opposing bound paper leaves. */
.living-grimoire{position:relative;color:#ddc7aa;padding-top:6px}.rf2 .grimoire-header{position:relative;display:flex;justify-content:center;text-align:center;width:100%;padding:3px 10px 60px;min-height:160px}.grimoire-title{display:flex;flex-direction:column;gap:4px}.grimoire-title small{font:8px/1.9 Georgia;letter-spacing:2.6px;color:#ba9b67}.grimoire-title strong{font:italic 33px/1.35 Georgia,serif;color:#ddc7aa}.grimoire-title>span{font-size:11px;line-height:1.8;color:#9d8d90}.grimoire-seal{position:absolute;width:61px;height:61px;bottom:10px;left:calc(50% - 30px);color:#d5b56b;z-index:3}.open-book{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:0 3px 6px;filter:drop-shadow(0 14px 12px #0003)}.book-page{position:relative;min-width:0;min-height:302px;padding:26px 24px 55px;color:#473d33;background:linear-gradient(90deg,#d0ba8b,#efe3c3 10%,#eee1bf 90%,#cbb386);font:15px/1.95 Georgia,'Noto Sans Thai',serif;border-top:1px solid #c4a46c;border-bottom:7px solid #745a3d;box-shadow:0 2px #ddcc9c,0 4px #6c5137,0 6px #c8b586}.page-left{border-radius:6px 0 0 4px;transform:skewY(-1deg);transform-origin:right center;padding-right:27px}.page-right{border-radius:0 6px 4px 0;transform:skewY(1deg);transform-origin:left center;background:linear-gradient(90deg,#bfa577,#eddfbc 15%,#f1e5c5 92%,#dfcda2);padding-left:27px}.page-heading{display:flex;gap:8px;align-items:center;border-bottom:1px solid #a8874c6b;padding-bottom:9px;margin-bottom:22px;font:8px/1.6 Georgia;letter-spacing:1.2px;color:#8b6c44}.page-heading .pen{width:14px;height:14px}.page-flourish{position:absolute;top:71px;left:21px;font:30px/1 Georgia;color:#9f7c48;opacity:.6}.page-left .story-copy{padding-top:10px}.page-right .story-copy{font-style:italic;color:#3c4146;padding-top:18px}.ink-quote{position:absolute;top:61px;left:22px;font:55px/1 Georgia;color:#817345;opacity:.6}.folio{position:absolute;bottom:15px;left:0;right:0;text-align:center;font:10px/1.6 Georgia;color:#937849}.wax- /* 05 — A landscape handscroll with a vertical identity panel at its right end. */
.lotus-scroll{display:grid;grid-template-columns:minmax(0,1fr) 87px;position:relative;padding:12px 11px;color:#284c42;isolation:isolate}.rf2 .lotus-header{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:center;width:87px;text-align:center;background:linear-gradient(90deg,#233d32,#182d25);color:#d9e4ce;padding:20px 8px 14px;position:relative;border-left:1px solid #98b99455}.lotus-title{display:flex;align-items:center;flex-direction:column}.lotus-title small{font:12px/1.6 serif;letter-spacing:4px;color:#94b69c}.lotus-title strong{font:44px/1.25 'Noto Serif CJK SC',serif;writing-mode:vertical-rl;letter-spacing:10px;margin-block:12px 10px;color:#e2e5ce}.lotus-title>span{font:italic 16px/1.8 Georgia;color:#becfb1}.jade-emblem{display:block;color:#8bac8d;width:35px;margin-top:14px}.chop{display:grid;place-items:center;font:14px/1.05 serif;width:26px;height:35px;background:#874940;border:1px solid #a56d55;color:#ecd3b6;margin-top:17px;transform:rotate(-4deg)}.lotus-affiliation{font:7px/1.7 Georgia;letter-spacing:1px;color:#8da58c;margin-top:12px}.scroll-leaf{grid-column:1;grid-row:1;min-width:0;background:linear-gradient(90deg,#d4d9bd,#eff0db 7%,#e6e8cd 94%,#c9cfb3);padding:26px 24px 21px}.lotus-notes{font:14px/2.05 'Noto Serif CJK SC','Noto Sans Thai',serif;color:#627060;position:relative;padding-bottom:24px}.scroll-heading{display:flex;align-items:center;gap:7px;font-size:9px;color:#7b8b72;letter-spacing:.8px;margin-bottom:13px}.scroll-heading .pen{width:14px;height:14px}.ink-wash{display:block;margin-top:20px;width:100%;height:18px;background:linear-gradient(170deg,transparent 40%,#687e6626 42%,transparent 55%),linear-gradient(175deg,transparent 45%,#687e661a 47%,transparent 65%);opacity:.7}.lotus-words{position:relative;border-top:1px solid #8b9b7b66;padding:27px 12px 27px 15px;font:16px/2.05 'Noto Serif CJK SC','Noto Sans Thai',serif;color:#284c42}.ink-opening,.ink-closing{position:absolute;font:25px/1 serif;color:#738a6b}.ink-opening{top:17px;left:-10px}.ink-closing{bottom:18px;right:-9px}.brush-rule{position:absolute;bottom:5px;left:17px;width:68%;height:2px;background:linear-gradient(90deg,#536f4aaa,transparent);transform:rotate(-1deg)}.scroll-roll{position:absolute;z-index:3;top:0;bottom:0;width:12px;background:linear-gradient(90deg,#365442,#9bab79,#456044);border-block:9px solid #344d3d;border-radius:3px;box-shadow:1px 1px 5px #0003}.roll-left{left:0}.roll-right{right:0}.petal{position:absolute;z-index:5;top:39px;right:72px;width:9px;height:15px;background:#bd9d9c;border-radius:100% 0 100% 0;transform:rotate(22deg);opacity:.75}

/* 06 — An avatar dock, a console log and a separate beveled transmission module. */
.neural-link{position:relative;display:grid;grid-template-columns:111px minmax(0,1fr);gap:21px;color:#a7d8dc;padding:8px 0}.rf2 .neural-header{display:flex;flex-direction:column;align-items:center;align-self:start;text-align:center;position:relative;width:100%;padding-top:25px}.neural-avatar{position:relative;width:95px;height:99px;background:#142329;clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px);border:1px solid #49828a}.neural-avatar>svg{width:89px;height:94px;margin:3px}.avatar-scan{position:absolute;left:0;right:0;height:1px;top:10px;background:#99f7e9;z-index:2;box-shadow:0 0 5px #99f7e977}.crosshair{position:absolute;width:18px;height:18px;border-color:#a8e5e5}.corner-tl{top:4px;left:4px;border-left:1px solid;border-top:1px solid}.corner-br{bottom:4px;right:4px;border-right:1px solid;border-bottom:1px solid}.neural-identity{display:flex;flex-direction:column;width:100%;gap:5px;margin-top:17px}.neural-identity small{font:7px/1.6 monospace;color:#78b79e;letter-spacing:.5px}.neural-identity small i{display:inline-block;background:#90cab0;width:4px;height:4px;margin-right:4px;border-radius:50%}.neural-identity strong{font:20px/1.35 'Courier New',monospace;letter-spacing:-1px;color:#ace7ed}.neural-identity>span{font-size:9px;color:#638990;line-height:1.8}.neural-identity b{font:7px/1.8 monospace;letter-spacing:1px;color:#689eac;margin-top:8px;border-top:1px solid #385459;padding-top:8px}.neural-stream{min-width:0}.neural-log{padding:15px 0 14px;border-top:1px solid #3f6b73;border-bottom:1px solid #30494e;color:#91aab1;font-size:13px;line-height:2}.console-caption{display:flex;justify-content:space-between;gap:10px;font:8px/1.8 monospace;letter-spacing:1.4px;color:#4e8d9a;margin-bottom:13px}.console-body{display:flex;gap:12px}.console-lines{flex:0 0 17px;text-align:right;color:#375c65;font:10px/2.65 monospace}.console-end{display:block;font:8px/1.8 system-ui;color:#5b8088;letter-spacing:.4px;margin-top:12px;padding-left:29px}.neural-speech{display:grid;grid-template-columns:32px minmax(0,1fr);position:relative;margin-top:22px;background:#132e36;border:1px solid #56b2bd;clip-path:polygon(0 0,calc(100% - 23px) 0,100% 23px,100% 100%,19px 100%,0 calc(100% - 19px));box-shadow:inset 0 0 0 5px #5ed5e51a}.signal-strip{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:15px 0 25px;background:#0b2229;color:#67c5d2;border-right:1px solid #4d8e9a99;font:9px/1 monospace}.signal-waves{display:flex;flex-direction:column;gap:4px;align-items:center;width:20px;margin-block:auto;padding:15px 0}.signal-waves i{height:2px;width:calc(7px + (var(--i) / 2)*2px);max-width:19px;background:#65c3ca;opacity:.7;transform-origin:center}.transmission{min-width:0;padding:17px 16px 18px}.transmission-label{display:flex;justify-content:space-between;font:7px/1.8 monospace;color:#6cbbc3;letter-spacing:1.2px;margin-bottom:12px}.transmission-label span{color:#95d5b4;font-size:8px}.transmission .story-copy{font-size:15px;line-height:1.95;color:#ceeaeb}.transmission-end{display:flex;justify-content:space-between;gap:5px;font:7px/1.8 monospace;color:#4e919d;letter-spacing:.6px;border-top:1px solid #3c677255;padding-top:10px;margin-top:14px}.transmission-end i{font-style:normal;letter-spacing:3px}

/* The independent switches remove only that part's frame and ornaments. */

  const themes = [
    {key:'relic',name:'Relic Ledger',genre:'RoleForge',form:'แฟ้มระบบแบบเปิด · แกนบันทึกเหตุการณ์ · บทพูดเป็นแผ่นพับซ้อน',gimmick:'ตราระบบมีแสงวิ่งช้า ๆ',profile:{name:'Arin Vale',title:'ผู้พิทักษ์บันทึก',role:'นักเดินทาง',faction:'ROLEFORGE',narrative:'แสงสีทองทาบบนหน้าคัมภีร์ อารินวางดาบข้างโต๊ะ ก่อนเลื่อนแผนที่มาหาคุณอย่างเงียบงัน',dialogue:'เส้นทางข้างหน้ายังไม่ถูกเขียน หากคุณพร้อม เราจะเริ่มการเดินทางบทใหม่นี้ไปด้วยกัน'}},

    {key:'thorn',name:'Thorn Testament',genre:'Dark Fantasy',form:'แผ่นจารึกทรงมหาวิหาร · บันทึกบนกระดาษฉีก · คำพูดขนาดใหญ่ไร้กล่อง',gimmick:'แสงถ่านในตราและประกายเถ้า',profile:{name:'Seren Voss',title:'ผู้เฝ้าคำสาบาน',role:'มนุษย์ · นักล่า',faction:'ASHEN ORDER',narrative:'เถ้าถ่านปลิวผ่านซุ้มประตู เซเรนดึงผ้าคลุมให้แน่นขึ้น เสียงระฆังจากวิหารร้างดังมาเพียงครั้งเดียว',dialogue:'อย่าตอบเสียงที่เรียกชื่อคุณจากความมืด ไม่ว่ามันจะฟังเหมือนคนที่คุณรักมากแค่ไหนก็ตาม'}},
    {key:'grimoire',name:'Living Grimoire',genre:'Magical Academy',form:'หนังสือเวทเปิดสองหน้า · บรรยายหน้าซ้าย · บทพูดหน้าขวา · สันหนังสือจริง',gimmick:'ตราวงเวทหมุนเหนือสันหนังสือ',profile:{name:'Elian Ash',title:'ผู้พิทักษ์หอคัมภีร์',role:'มนุษย์ · จอมเวท',faction:'ASTRAL ACADEMY',narrative:'ตราเวทบนปกหนังสือหมุนช้า ๆ เอเลียนแตะปลายไม้กายสิทธิ์ลงบนโต๊ะ แสงดวงเล็กส่องขึ้นจากหมึกเก่า',dialogue:'คาถาไม่ได้เริ่มที่ไม้กายสิทธิ์ แต่มันเริ่มที่สิ่งที่คุณตั้งใจจะปกป้อง เปิดหน้าถัดไปสิ แล้วลองอีกครั้ง'}},
    {key:'lotus',name:'Lotus Scroll',genre:'Chinese Fantasy',form:'ม้วนคัมภีร์แนวนอน · ป้ายชื่อแนวตั้งด้านขวา · บทพูดเป็นข้อความหมึกบนกระดาษ',gimmick:'กลีบบัวลอยข้างตราประทับ',profile:{name:'Lin Yue',title:'ผู้สืบทอดสำนักเมฆา',role:'เซียน · นักกระบี่',faction:'CLOUD SECT',narrative:'สายลมพากลีบบัวผ่านศาลาริมน้ำ หลินเยว่เก็บกระบี่เข้าฝัก แล้วรินชาลงในถ้วยหยกที่วางตรงหน้าคุณ',dialogue:'กระบี่ที่สงบไม่ได้ไร้คม เช่นเดียวกับใจที่นิ่งไม่ได้ไร้ความฝัน ดื่มชาก่อนเถิด แล้วเราค่อยฝึกต่อ'}},
    {key:'neural',name:'Neural Link',genre:'Advanced Futuristic',form:'โมดูลสื่อสารแยกส่วน · ตัวละครเป็นสถานีเชื่อมต่อ · บันทึก Console · บทพูดเป็นสัญญาณ',gimmick:'เส้น Scan และแถบสัญญาณเคลื่อนไหว',profile:{name:'NOVA-07',title:'ระบบนำทางภาคสนาม',role:'แอนดรอยด์ · พันธมิตร',faction:'NEXUS',narrative:'เส้นสัญญาณสีฟ้าปรากฏเหนือแผงควบคุม โนวาหยุดประมวลผลชั่วครู่ ก่อนฉายแผนที่สถานีลงบนผนัง',dialogue:'ยืนยันเส้นทางใหม่แล้ว ประตูฝั่งตะวันออกยังเปิดอยู่ ฉันจะติดตามสัญญาณของคุณตลอดการเคลื่อนที่'}},
  ];
  const renderers = {
    relic(s) {
      const crest=svg('<path d="m32 3 25 15v28L32 61 7 46V18Z" stroke="currentColor"/><path d="M32 13v39M17 24h30M17 40h30M22 18v28M42 18v28" stroke="currentColor"/><path class="glint" d="m32 0 3 4-3 4-3-4Z" fill="currentColor"/>');
      return `<div class="relic-file"><div class="relic-spine decoration"><span>RF</span><i></i><span>01</span></div><div class="relic-content">
        ${record(s,`<span class="relic-crest">${crest}</span><span class="relic-identity"><small>CHARACTER RECORD / 001</small><strong>${escape(s.name)}</strong><span>${escape(s.title)} <b>◆</b> พันธมิตร</span></span><span class="record-arrow decoration">${svg('<path d="M4 12 12 4M4 4h8v8" stroke="currentColor"/>','','0 0 16 16')}</span>`,'relic-header')}
        <section class="part-narrative relic-entry"><div class="entry-index decoration"><span>01</span>${pen}</div><div><div class="entry-kicker decoration">CHRONICLE <span>บันทึกเหตุการณ์</span></div>${paragraph(s,'narrative')}<span class="entry-end decoration">◆ ──</span></div></section>
        <section class="part-dialogue relic-fold"><div class="fold-tab decoration">VOICE / ${escape(s.name)}</div><span class="fold-quote decoration">“</span>${paragraph(s,'dialogue')}<div class="fold-end decoration"><span>คำตอบจากพันธมิตร</span><i>▰ ▰ ▱</i></div></section>
      </div><span class="file-corner decoration"></span></div>`;
    },
    starfall(s) {
      return `<div class="starfall-stage">
        ${record(s,`<span class="starfall-name"><small>${escape(s.faction)}</small><strong>${escape(s.name)}</strong><span>${escape(s.title)} <i>✦</i> สหาย</span></span><span class="starfall-portrait"><span class="portrait-orbit decoration"></span>${portrait('anime')}<span class="star-a decoration">✦</span><span class="star-b decoration">✧</span></span>`,'starfall-header')}
        <section class="part-narrative starfall-caption"><div class="caption-stars decoration">✧ <span>ระหว่างการเดินทาง</span> ✧</div>${paragraph(s,'narrative')}</section>
        <section class="part-dialogue starfall-bubble"><span class="bubble-name decoration">${escape(s.name)} <i>✦</i></span><span class="bubble-tail decoration"></span>${paragraph(s,'dialogue')}<span class="bubble-next decoration">✦ ✧ ✦</span></section>
        <span class="stage-spark decoration">${star}</span>
      </div>`;
    },
    thorn(s) {
      return `<div class="thorn-testament">
        ${record(s,`<span class="cathedral-window"><svg viewBox="0 0 160 220" aria-hidden="true"><path d="M6 213V102C6 59 39 23 80 5c41 18 74 54 74 97v111Z" fill="#151314" stroke="#655149"/><path d="M16 203V105c0-36 28-68 64-88 36 20 64 52 64 88v98Z" fill="none" stroke="#3f3531"/><path d="M80 17v180M17 104h126M26 68h108" stroke="#322c29"/><circle cx="80" cy="75" r="18" fill="#5b2622" class="ember"/></svg><span class="dark-portrait">${portrait('dark')}</span></span><span class="thorn-title"><small>${escape(s.faction)}</small><strong>${escape(s.name)}</strong><span>${escape(s.title)}</span></span>`,'thorn-header')}
        <div class="thorn-texts"><section class="part-narrative torn-manuscript"><div class="manuscript-label decoration">${pen}<span>จากบันทึกที่เหลืออยู่</span><i>III</i></div>${paragraph(s,'narrative')}<span class="manuscript-rule decoration"></span></section>
        <section class="part-dialogue thorn-vow"><span class="vow-mark decoration">“</span>${paragraph(s,'dialogue')}<span class="vow-end decoration">⟡</span></section></div>
        <span class="ash ash-one decoration"></span><span class="ash ash-two decoration"></span>
      </div>`;
    },
    grimoire(s) {
      return `<div class="living-grimoire">
        ${record(s,`<span class="grimoire-title"><small>${escape(s.faction)}</small><strong>${escape(s.name)}</strong><span>${escape(s.title)}</span></span><span class="grimoire-seal">${seal}</span>`,'grimoire-header')}
        <div class="open-book"><section class="part-narrative book-page page-left"><div class="page-heading decoration">${pen}<span>THE CHRONICLE</span></div><span class="page-flourish decoration">✧</span>${paragraph(s,'narrative')}<span class="folio decoration">— 14 —</span></section>
        <section class="part-dialogue book-page page-right"><div class="page-heading decoration"><span>WORDS TO REMEMBER</span></div><span class="ink-quote decoration">“</span>${paragraph(s,'dialogue')}<span class="wax-seal decoration">A</span><span class="folio decoration">— 15 —</span></section><span class="book-binding decoration"></span></div>
      </div>`;
    },
    lotus(s) {
      return `<div class="lotus-scroll"><span class="scroll-roll roll-left decoration"></span><span class="scroll-roll roll-right decoration"></span>
        ${record(s,`<span class="lotus-title"><small>雲門</small><strong>林月</strong><span>${escape(s.name)}</span></span><span class="jade-emblem decoration">${lotus}</span><span class="chop decoration">雲<br>印</span><span class="lotus-affiliation">${escape(s.faction)}</span>`,'lotus-header')}
        <div class="scroll-leaf"><section class="part-narrative lotus-notes"><div class="scroll-heading decoration">${pen}<span>山水記 · บันทึกริมธาร</span></div>${paragraph(s,'narrative')}<span class="ink-wash decoration"></span></section>
        <section class="part-dialogue lotus-words"><span class="ink-opening decoration">「</span>${paragraph(s,'dialogue')}<span class="ink-closing decoration">」</span><span class="brush-rule decoration"></span></section></div><span class="petal decoration"></span>
      </div>`;
    },
    neural(s) {
      const waves=Array.from({length:9},(_,i)=>`<i style="--i:${i}"></i>`).join('');
      return `<div class="neural-link">
        ${record(s,`<span class="neural-avatar"><span class="avatar-scan decoration"></span>${portrait('future')}<span class="crosshair corner-tl decoration"></span><span class="crosshair corner-br decoration"></span></span><span class="neural-identity"><small><i></i> LINK ESTABLISHED</small><strong>${escape(s.name)}</strong><span>${escape(s.title)}</span><b>${escape(s.faction)} // ALLY</b></span>`,'neural-header')}
        <div class="neural-stream"><section class="part-narrative neural-log"><div class="console-caption decoration"><span>FIELD LOG</span><span>14:32:07</span></div><div class="console-body"><span class="console-lines decoration">01<br>02<br>03<br>04</span>${paragraph(s,'narrative')}</div><span class="console-end decoration">▮ บันทึกสถานการณ์ล่าสุด</span></section>
        <section class="part-dialogue neural-speech"><div class="signal-strip decoration"><span>TX</span><div class="signal-waves">${waves}</div></div><div class="transmission"><div class="transmission-label decoration">LIVE TRANSMISSION <span>●</span></div>${paragraph(s,'dialogue')}<span class="transmission-end decoration">SECURE CHANNEL / 07 <i>•••</i></span></div></section></div>
      </div>`;
    },
  };
  const grid=document.getElementById('design-gallery'),filter=document.getElementById('theme-filter'),size=document.getElementById('size-filter');
  const roots=[],cards=[];
  for(const [index,theme] of themes.entries()) {
    const article=document.createElement('article');article.className='design-demo';article.dataset.design=theme.key;
    article.innerHTML=`<div class="design-label"><span class="design-number">0${index+1}</span><div><small>${theme.genre}</small><h2>${theme.name}</h2></div><span class="design-type">${['DOSSIER','VISUAL NOVEL','GOTHIC RELIC','OPEN SPELLBOOK','HANDSCROLL','COMMS HUD'][index]}</span></div><div class="design-stage"><div class="rf2" data-theme="${theme.key}"><div class="plain-name">${escape(theme.profile.name)}</div>${renderers[theme.key](theme.profile)}</div></div><div class="design-note"><p>${theme.form}</p><small><span class="note-dot" aria-hidden="true"></span>${theme.gimmick}</small></div>`;
    grid.append(article);cards.push(article);roots.push(article.querySelector('.rf2'));
    const option=document.createElement('option');option.value=theme.key;option.textContent=`${theme.name} · ${theme.genre}`;filter.append(option);
  }
  function select(value) {document.body.classList.toggle('single-design',value!=='all');for(const card of cards)card.hidden=value!=='all'&&card.dataset.design!==value;filter.value=value;}
  filter.addEventListener('change',()=>select(filter.value));
  size.addEventListener('change',()=>document.body.classList.toggle('phone-mode',size.value==='phone'));
  for(const input of document.querySelectorAll('[data-part]'))input.addEventListener('change',()=>roots.forEach(root=>root.classList.toggle(`${input.dataset.part}-off`,!input.checked)));
  const observer=new IntersectionObserver(entries=>{for(const e of entries)e.target.classList.toggle('in-view',e.isIntersecting);});
  roots.forEach(root=>observer.observe(root));
  document.addEventListener('visibilitychange',()=>roots.forEach(root=>root.classList.toggle('tab-hidden',document.hidden)));
  const dialog=document.getElementById('profile-preview');
  for(const button of document.querySelectorAll('[data-profile]'))button.addEventListener('click',()=>{const s=themes.find(theme=>theme.profile.name===button.dataset.profile).profile;dialog.querySelector('h2').textContent=s.name;dialog.querySelector('p').textContent=[s.title,s.role,s.faction].join(' · ');dialog.showModal();});
  const params=new URL(location.href).searchParams,requested=params.get('theme');if(themes.some(theme=>theme.key===requested))select(requested);
  if(params.get('size')==='phone'){size.value='phone';document.body.classList.add('phone-mode');}
  window.roleforgeDesignStudy={ready:true,themes,roots,select};
})();
</script>
</body>
</html>
