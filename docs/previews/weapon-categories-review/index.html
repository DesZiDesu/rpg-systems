<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoleForge · Universal Weapon Models</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#131716;color:#deded0;font:15px/1.6 system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:34px 28px}small{color:#b9aa7b;letter-spacing:2px}h1{font-weight:500;font-size:34px;margin:8px 0}p{color:#969e90}header{border-bottom:1px solid #484a3e;padding-bottom:20px}nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:24px 0}button,select{font:inherit;color:#d6d7c7;border:1px solid #555746;border-radius:5px;background:#252b27;padding:8px 14px;min-height:42px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}article{min-width:0;background:radial-gradient(ellipse at center,#29312b,#1d2421);border:1px solid #474c3f;border-radius:7px;overflow:hidden;position:relative}article>small{position:absolute;left:15px;top:10px;font:10px monospace;color:#8e9b86}article>img{display:block;width:100%;height:118px;object-fit:contain;padding:12px 15px 0}article>div{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:9px 14px 14px;border-top:1px solid #46503d33}b{display:block;font-size:14px;font-weight:500}article p{margin:2px 0;font-size:11px}article button{min-height:32px;padding:3px 8px;font-size:11px}footer{margin-top:28px;color:#899580;font-size:12px}.lightbox{position:fixed;inset:0;background:#080d0be8;z-index:2;display:grid;place-items:center;padding:20px}.lightbox>div{width:min(900px,100%);background:#202824;border:1px solid #7b7759;border-radius:8px;padding:25px}.lightbox img{width:100%;height:260px;object-fit:contain}.lightbox button{float:right}[hidden]{display:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){main{padding:22px 14px}h1{font-size:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}article>img{height:96px;padding:9px 7px 0}article>div{padding:7px 10px 10px}b{font-size:12px}article p{font-size:10px}article button{display:none}}
</style>
<main><header><small>ROLEFORGE / UNIVERSAL ARSENAL</small><h1>ภาพกลางอาวุธ · 34 หมวด</h1><p>ภาพ 2D สำหรับเลือกใช้ตามประเภทอาวุธ · หมวดอื่นใช้ Relic หรือภาพที่ผู้ใช้ใส่เอง</p></header><nav><select id="group" aria-label="หมวดอาวุธ"></select><button id="prev">←</button><span id="page"></span><button id="next">→</button><button id="all">ดูทั้งหมด</button></nav><div class="grid" id="grid"></div><footer>ภาพในคลังไม่มอบอาวุธให้ผู้เล่น · Excalibur และ Ea เลือกใช้จากอาวุธที่มีจริงในแชท · ระบบอาวุธปิดเป็นค่าเริ่มต้น</footer></main>
<div class="lightbox" id="zoom" hidden><div><button id="close">ปิด ×</button><h2 id="title"></h2><img id="image" alt=""><p id="note"></p></div></div>
<script type="module">
import {WEAPON_CATEGORIES as categories,WEAPON_GROUPS as groups,weaponModelUrl} from '../../../src/weapon-catalog.js';
const $=id=>document.getElementById(id);let page=0,all=new URLSearchParams(location.search).has('all');
const opt=document.createElement('option');opt.value='';opt.textContent='ทุกหมวด';$('group').append(opt);for(const [id,[en,th]]of Object.entries(groups)){const o=document.createElement('option');o.value=id;o.textContent=th+' / '+en;$('group').append(o);}
function render(){const rows=categories.filter(c=>!$('group').value||c.group===$('group').value),pages=Math.max(1,Math.ceil(rows.length/12));page=Math.min(page,pages-1);$('grid').replaceChildren();for(const c of (all?rows:rows.slice(page*12,page*12+12))){const card=document.createElement('article'),number=document.createElement('small'),img=document.createElement('img'),body=document.createElement('div'),copy=document.createElement('div'),title=document.createElement('b'),caption=document.createElement('p'),button=document.createElement('button');number.textContent=String(categories.indexOf(c)+1).padStart(2,'0')+' / '+c.group.toUpperCase();img.src=weaponModelUrl(c.id);img.alt=c.en;title.textContent=c.en;caption.textContent=c.th;copy.append(title,caption);button.textContent='ดู';button.onclick=()=>{const z=$('zoom');$('title').textContent=c.en+' · '+c.th;$('image').src=img.src;$('image').alt=c.en;$('note').textContent='ประเภททรัพยากร: '+c.resourceMode+' · จำนวนจริงอ้างอิงโรลและ Inventory เท่านั้น';z.hidden=false;$('close').focus();};body.append(copy,button);card.append(number,img,body);card.onclick=e=>{if(e.target!==button)button.click();};$('grid').append(card);}$('page').textContent=all?rows.length+' ภาพ':`${page+1} / ${pages}`;$('prev').disabled=all||page===0;$('next').disabled=all||page>=pages-1;}
$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('all').onclick=()=>{all=!all;page=0;render();};$('group').onchange=()=>{page=0;render();};$('close').onclick=()=>$('zoom').hidden=true;document.addEventListener('keydown',e=>{if(e.key==='Escape')$('zoom').hidden=true;});render();window.categoryPreviewReady=true;
</script></html>
