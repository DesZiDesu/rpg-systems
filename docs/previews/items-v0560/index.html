<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoleForge 0.56.0 · Loot / Items</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#dedede;font:14px/1.7 system-ui,sans-serif}main{max-width:1260px;margin:auto;padding:30px 20px}h1{font-size:24px;font-weight:600;margin:0 0 5px}p{color:#aaa;margin:6px 0 20px}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:20px 0}button{background:#292929;color:#dedede;border:1px solid #4d4d4d;border-radius:6px;padding:7px 12px;min-height:36px;font:12px system-ui,sans-serif;cursor:pointer}button[aria-pressed=true]{background:#c5c5c5;color:#1b1b1b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}figure{margin:0;border:1px solid #3f3f3f;border-radius:10px;background:#181818;overflow:hidden}figcaption{padding:13px 14px;font-weight:500}figcaption small{display:block;font-size:11px;font-weight:400;color:#999;margin-top:4px}figure img{display:block;width:100%;height:auto;cursor:zoom-in}dialog{background:#181818;color:#ddd;border:1px solid #555;border-radius:10px;padding:10px;max-width:95vw;max-height:95vh}dialog::backdrop{background:#000c}dialog header{text-align:right;position:sticky;top:0;background:#181818;padding-bottom:8px}dialog img{max-width:100%;height:auto}a{color:#dedede}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){main{padding:20px 12px}.grid{grid-template-columns:1fr}h1{font-size:21px}}body.overview main{padding:22px}body.overview .grid{grid-template-columns:repeat(3,minmax(0,1fr))}body.overview .controls,body.overview .intro-link{display:none}body.overview figure img{height:330px;object-fit:contain;object-position:top;background:#181818}body.overview h1{font-size:22px}body.overview p{font-size:12px;margin-bottom:16px}
</style><main><h1>RoleForge 0.56.0 · Loot / Items</h1><p>แผงจริงจาก loader ของส่วนเสริม · หน้าตาเดียวกับฝึกฝน · ภาพใช้ AI จำลองในการทดสอบ ไม่มีการเรียกบัญชีจริง</p><p class="intro-link"><a href="../../items-update.th.md">วิธีใช้และ Workflow</a> · กดภาพเพื่อดูขนาดเต็ม</p><div class="controls"><span>ขนาดจอ</span><button data-width="320">320 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="1280">1280 px</button></div><div class="grid"></div></main><dialog><header><button data-close>ปิดภาพ</button></header><img alt="ภาพ UI ขนาดเต็ม"></dialog><script>
const states=[["loot-compact", "Loot แบบสรุป", "พบของแล้วเลือกก่อนเก็บ ไม่มี API เพิ่มตอนอ่านรายการ"], ["loot-selected", "เลือกของและจำนวน", "เลือกบางส่วนได้ จำนวนที่เหลืออยู่ในแหล่งเดิม"], ["loot-details", "รายละเอียด Loot", "ดูคุณสมบัติก่อนตัดสินใจเก็บ"], ["item-summary", "แผงไอเทมและปุ่มเติมข้อมูล", "ใช้ / กิน / ดื่ม ทิ้ง มอบ และเติมข้อมูลทั้งคลัง"], ["drink-details", "รายละเอียดวิธีใช้", "ผล เงื่อนไข เป้าหมาย Cooldown และจำนวนที่ใช้"], ["eat-summary", "กินไอเทม", "แสดงการกระทำตามประเภทไอเทม"], ["key", "กุญแจและสิทธิ์เช่า", "ใช้ตามสิทธิ์เดิม ไม่ทิ้งหรือมอบกุญแจเช่า"], ["unknown", "ข้อมูลวิธีใช้ยังไม่ทราบ", "ปุ่มใช้กดไม่ได้ พร้อมเตรียมโรลตรวจสอบ"], ["gift", "เลือกผู้รับในฉาก", "เลือก NPC ที่อยู่ในฉากเท่านั้น ผู้รับอาจปฏิเสธ"], ["drop", "ยืนยันการทิ้ง", "ย้ายของไปยังสถานที่ปัจจุบัน เก็บกลับได้"], ["queued", "รอคำตอบใหม่", "ส่งโรลใหม่แล้วรอผลต่อท้ายคำตอบถัดไป"], ["result-success", "ผลที่บันทึกแล้ว", "แสดงรายการและจำนวนจากผลที่ยืนยัน"], ["result-refusal", "NPC ปฏิเสธ", "ของและจำนวนยังอยู่กับผู้เล่น"], ["details-working", "AI เติมข้อมูลทั้งคลัง", "แจ้งเตือนทุก API และแสดงความคืบหน้า"], ["details-partial", "บันทึกบางชุดแล้วเกิดข้อผิดพลาด", "รักษาชุดที่สำเร็จ ลองเฉพาะข้อมูลที่ยังขาดได้"], ["details-updated", "ผลเติมข้อมูล", "ไม่เขียนทับข้อมูลเดิม จำนวน เงิน หรือข้อความ AI"], ["no-npc", "ไม่มีผู้รับอยู่ในฉาก", "แสดงเหตุผลที่ปุ่มมอบกดไม่ได้"], ["minimized", "แถบย่อและ Tabs", "แผงแต่ละระบบแยกกัน ไม่เปิดทับกัน"], ["inventory", "เลือกจากคลัง RoleForge", "กดเลือกไอเทมเพื่อปิดหน้าต่างและกลับสู่แชต"]];let width=390;const modal=document.querySelector('dialog');function render(){const overview=new URLSearchParams(location.search).has('overview');document.body.classList.toggle('overview',overview);const subset=overview?states.filter(s=>['loot-selected','item-summary','gift','drop','details-working','details-updated'].includes(s[0])):states;document.querySelector('.grid').replaceChildren(...subset.map(([id,title,description])=>{const f=document.createElement('figure'),caption=document.createElement('figcaption'),small=document.createElement('small'),img=document.createElement('img');caption.textContent=title;small.textContent=description;caption.append(small);img.src=id+'-'+width+'.png';img.alt=title+' · '+width+'px';img.onclick=()=>{modal.querySelector('img').src=img.src;modal.showModal();};f.append(caption,img);return f;}));for(const b of document.querySelectorAll('[data-width]'))b.setAttribute('aria-pressed',String(Number(b.dataset.width)===width));}for(const b of document.querySelectorAll('[data-width]'))b.onclick=()=>{width=Number(b.dataset.width);render();};document.querySelector('[data-close]').onclick=()=>modal.close();modal.onclick=e=>{if(e.target===modal)modal.close();};render();
</script></html>
