<main><h1>RoleForge 0.53.2 · ซื้อขายและกุญแจ</h1><p>ภาพจากหน้าแชตและ Inventory ที่ใช้ตัวโหลดจริง จอ 390 พิกเซล คำตอบ AI เป็นข้อมูลทดสอบควบคุม กดภาพเพื่อเปิดขนาดเต็ม</p><section>
<figure><h2>แค่พูดถึงซื้อขาย</h2><figcaption>AI ระบุว่ายังไม่ได้ต้องการทำรายการ หน้าต่างซื้อขายไม่ขึ้น และเงิน/ของไม่เปลี่ยน</figcaption><a href="talk-no-commerce-390.png"><img src="talk-no-commerce-390.png" alt="หน้าแชตเมื่อพูดถึงซื้อขาย ไม่มีหน้าต่างซื้อขาย"></a></figure>
<figure><h2>เลือกห้องพักในคำตอบเดียว</h2><figcaption>ราคา 5 และ 10 เงิน กุญแจ สิ่งที่รวม และคืนก่อนเที่ยงวันถัดไป มาจากคำตอบปัจจุบัน ไม่เรียก API สร้างรายการเพิ่ม</figcaption><a href="room-offer-390.png"><img src="room-offer-390.png" alt="รายการห้องพักและสิทธิ์เหนือช่องพิมพ์"></a></figure>
<figure><h2>ซื้อบ้านถาวร</h2><figcaption>ชื่อรายการยังเป็นบ้าน พร้อมราคาสถานที่และกรรมสิทธิ์ รายละเอียดบอกว่าจะได้รับกุญแจบ้าน</figcaption><a href="property-offer-390.png"><img src="property-offer-390.png" alt="ข้อเสนอซื้อบ้านพร้อมกุญแจและกรรมสิทธิ์ถาวร"></a></figure>
<figure><h2>กุญแจใน Inventory</h2><figcaption>หลังยืนยันซื้อ คลังได้รับไอเทม “กุญแจบ้านริมแม่น้ำ” พร้อมขอบเขตกรรมสิทธิ์ถาวร</figcaption><a href="property-key-inventory-390.png"><img src="property-key-inventory-390.png" alt="คลังของแสดงเงิน สิทธิ์พักห้อง และกุญแจบ้าน"></a><a href="property-key-card-390.png"><img src="property-key-card-390.png" alt="รายละเอียดกุญแจบ้านริมแม่น้ำที่เป็นกรรมสิทธิ์ถาวร"></a></figure>
